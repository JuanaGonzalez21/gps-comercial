[project]
name = "gps-comercial-api"
version = "0.1.0"
description = "GPS Comercial API: fleet monitoring backend integrating Wialon"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.2",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
